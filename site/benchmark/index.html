function calendarDate(value){if(!value)return '待核实';const date=new Date(value);return Number.isNaN(date.getTime())?show(value):date.toISOString().slice(0,10);}
function dateBasis(value){return ({PAPER_V1_PROXY:'论文首版公开时间（代理依据）',FIRST_DISCLOSURE:'首次公开证据',UNKNOWN:'待核实'})[value]||show(value);}
function labelStatus(value){return ({PENDING:'待核验',ACCEPTED:'已核验',PASSED:'已核验',REVIEW:'待复核',FAILED:'核验暂未完成'})[value]||show(value);}
function publicLabel(value,fallback=''){const text=String(value??'').trim();return !text||/^(?:(?:table|row|column|cell|group|obs(?:ervation)?|chunk|source|benchmark)[_:-])?[0-9a-f]{16,}(?:$|[:_-])/i.test(text)||/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(text)||/:(?:column|row):\d+/i.test(text)?fallback:text;}
function sourceLabel(table){return publicLabel(table,'论文来源');}
function measurementLabel(g){return {INTERVENTION_EFFECT:'提示或干预增益',STATISTICAL_DIAGNOSTIC:'统计诊断量',RESOURCE_MEASUREMENT:'资源与效率'}[g.measurement_kind]||{INTERVENTION_EFFECT:'提示或干预增益',STATISTIC:'统计诊断量',DERIVED_STATISTIC:'统计诊断量',EFFICIENCY:'资源与效率'}[g.metric_role]||'';}
function chart(){const root=document.getElementById('chart'),note=document.getElementById('group-status'),select=document.getElementById('metric-group');root.replaceChildren();const group=(detail.metric_groups||[]).find(g=>g.group_id===select.value);if(!group){note.textContent='尚无可比的模型成绩；来源观测和审核状态仍可查看。';return;}if((group.blocked_reasons||[]).length){note.textContent='此组不能排名：'+show(group.blocked_reasons);return;}const scores=[...(group.scores||[])].sort((a,b)=>(group.direction==='lower'?1:-1)*(a.value_numeric-b.value_numeric)||a.model_canonical.localeCompare(b.model_canonical));note.textContent=sourceLabel(group.table_id)+' · 指标 '+show(group.metric)+' · 方向 '+(group.direction==='lower'?'负向指标':'正向指标')+' · 模型 '+scores.length+' 个'+(measurementLabel(group)?' · '+measurementLabel(group)+'，不计入综合分':'');const values=scores.map(s=>s.value_numeric).filter(Number.isFinite),lo=Math.min(0,...values),hi=Math.max(0,...values),span=hi-lo||1,zero=100*(0-lo)/span;for(const row of scores){const line=el('div');line.className='bar-row';const name=modelLink(row.model_canonical),track=el('div'),fill=el('div'),value=el('span',show(row.value_numeric));track.className='bar-track';fill.className='bar-fill';const x=100*(row.value_numeric-lo)/span;track.style.position='relative';fill.style.position='absolute';fill.style.left=Math.min(x,zero)+'%';fill.style.width=Math.abs(x-zero)+'%';value.className='bar-value';fill.style.background=['#1674dc','#5aa6ed','#94c5f5','#596d83','#8398ac'][root.childElementCount%5];track.append(fill);line.append(name,track,value);root.append(line);}}
function detailLabels(b){
  if(b.catalog_label_sources?.length&&b.catalog_labels)return b.catalog_labels;
  const raw=b.enrichment?.labels||{},result={};
  for(const layer of ['domains','tasks','capabilities'])result[layer]=Object.hasOwn(raw.supported||{},layer)?raw.supported[layer]:raw.status==='SUPPORTED'?raw[layer]||[]:[];
  return result;
}
function processingDescription(b,observations){
  const p=b.progress||{},hasScores=observations.length>0;
  const states={EXCLUDED:'已排除，未产出可发布成绩',RETRY_EXHAUSTED:'提取重试已耗尽，暂无可发布成绩',FAILED:'处理失败，暂无可发布成绩',COMPLETE:'来源论文已完成处理，本条目暂无成绩',PENDING:'等待处理，暂无成绩',RUNNING:'正在处理，暂无成绩'};
  return {title:hasScores?'已有来源成绩':states[p.paper_status]||'快照中尚无可发布成绩',
    reason:p.paper_reason||b.reason||'快照没有记录具体处理原因。',
    scope:p.gap_scope==='PAPER'?'来源论文处理说明':'处理说明',
    completion:p.paper_extraction_complete?'论文提取已完成':p.paper_status==='EXCLUDED'?'此来源已停止自动补跑':p.paper_status==='RETRY_EXHAUSTED'?'自动重试次数已用尽':'处理状态以此快照记录为准'};
}
function renderNameAudit(b){
  const root=document.getElementById('name-audit');root.replaceChildren();const a=b.name_audit;if(!a||document.body.dataset.edition!=='admin')return;
  const repaired=a.status==='REPAIRED',note=el('p',repaired?'名称已按本条目的来源原文修正。':'原始记录把表格数值或截断文本当成名称，暂不能确认正式名称。');note.className='muted';
  const details=el('details');details.append(el('summary','原始名称与核对依据'),el('p','原始名称：'+a.original_name));
  if(repaired)details.append(el('p','修正名称：'+a.corrected_name));
  const reasons={SCORE_CELL:'名称指向表格数值',TABLE_FRAGMENT:'名称包含表格结构片段',CLIPPED_SOURCE_SPAN:'名称截断了原文单词',EMPTY_NAME:'名称为空'};
  details.append(el('p','核对结果：'+(reasons[a.reason]||a.reason)));
  if(a.evidence_quote)details.append(el('blockquote',a.evidence_quote));root.append(note,details);
}
function render(d){const management=new URLSearchParams(location.search).get('edition')==='admin',unavailable=!management&&!window.RadarViz.publicBenchmarkVisible(d.benchmark);document.body.dataset.edition=management?'admin':'visitor';document.getElementById('task-evidence-panel').hidden=!management;document.body.classList.toggle('public-unavailable',unavailable);if(unavailable){detail=null;document.title='评测详情 · 模型评测';document.getElementById('title').textContent='该评测暂未公开展示';document.getElementById('summary').textContent='请返回评测目录查看已公开条目。';return;}detail=d;renderNameAudit(d.benchmark);window.RadarViz.renderModelRoster(document.getElementById('tested-models'),d.observations,d.metric_groups||[],name=>{location.href=modelLink(name).href;});const b=d.benchmark,e=b.enrichment||{},labels=detailLabels(b),assets=e.assets||{},badge=document.getElementById('status-badge');document.title=b.benchmark_name+' · 论文 Meta 分析';document.getElementById('title').textContent=b.benchmark_name;badge.textContent=b.name_audit?.status==='REVIEW_REQUIRED'?'名称待核验':b.eligibility==='ELIGIBLE'?'已核实纳入':'待复核 · '+show(b.eligibility);badge.className='badge'+(b.eligibility==='ELIGIBLE'&&b.name_audit?.status!=='REVIEW_REQUIRED'?'':' review');document.getElementById('summary').textContent=show(b.reason);const meta=document.getElementById('meta');meta.replaceChildren(el('span','Benchmark 首次发布：'+calendarDate(b.release_date)),el('span','论文首次公开：'+calendarDate(b.paper_first_published)),el('span','核验依据：'+dateBasis(b.date_basis)));const models=new Set(d.observations.map(r=>r.model_canonical).filter(Boolean));const stats=document.getElementById('stats');stats.replaceChildren();for(const [name,value] of [['来源成绩',d.observations.length],['来源模型名称',models.size],['可比指标组',(d.metric_groups||[]).filter(g=>!(g.blocked_reasons||[]).length).length],['任务匹配组',d.task_matches.length]]){const box=el('div');box.className='stat';box.append(el('strong',value),el('span',name));stats.append(box);}const tags=document.getElementById('tags');tags.replaceChildren();chips('tags','领域',labels.domains);chips('tags','任务',labels.tasks);chips('tags','能力',labels.capabilities);tags.append(el('p',labels.capabilities?.length?'能力按 Benchmark 标注，各评测组共用':'本条目暂无可用的能力标注。'));const progress=b.progress||{},processing=processingDescription(b,d.observations);if(management)tags.append(el('h3','处理情况'),el('p',processing.title),el('p',`来源评测组 ${progress.total_groups||0} 组 · ${processing.completion}`),el('p',processing.scope+'：'+processing.reason));if(management)for(const a of (d.capability_annotations||[]).filter(a=>a.status==='SUPPORTED')){const box=el('details');box.append(el('summary',show(a.metric)+' · '+show(a.status)+' · '+show(a.capabilities)),el('p',a.reason||'来源标签'));for(const proof of a.evidence||[]){box.append(el('small','原文证据'),el('blockquote',proof.quote));}tags.append(box);}const resources=document.getElementById('resources');resources.replaceChildren();if(b.directory_sources?.length>1){const related=el('details');related.open=true;related.append(el('summary','同名评测的 '+b.directory_sources.length+' 条来源'),el('p','各论文的评测条件与成绩分别保留。'));for(const ref of b.directory_sources){const u=new URL('benchmark',location.href);u.search=new URLSearchParams({paper_id:ref.paper_id,benchmark_id:ref.benchmark_id,...(management?{edition:'admin'}:{})});const line=el('p');line.append(safeLink(u.href,ref.paper_title||ref.benchmark_name));related.append(line);}resources.append(related);} const paper=el('p');paper.append(safeLink(b.source_url,b.paper_title));resources.append(paper,el('p','首次发布日期证据：'+show(b.evidence_quote)));for(const item of assets.items||[]){const line=el('p');line.append(safeLink(item.url,item.kind||'资源'),el('span',' · '+show(item.link_status)+' · 许可 '+show(item.license_claim)));resources.append(line);}if(!(assets.items||[]).length)resources.append(el('p','尚无已确认公开资源'));const select=document.getElementById('metric-group');select.replaceChildren();for(const g of d.metric_groups||[]){const opt=el('option',show(g.metric)+(measurementLabel(g)?'（'+measurementLabel(g)+'）':'')+' · '+publicLabel(g.row_key,'综合指标')+' · '+show(g.model_setting)+' · '+sourceLabel(g.table_id)+(g.blocked_reasons.length?'（待复核）':''));opt.value=g.group_id;select.append(opt);}if(!(d.metric_groups||[]).some(g=>g.group_id===chosenGroup))chosenGroup=(d.metric_groups||[]).find(g=>!(g.blocked_reasons||[]).length)?.group_id||d.metric_groups[0]?.group_id||'';select.value=chosenGroup;chart();drawTable('observations',d.observations.map(r=>({...r,source_label:sourceLabel(r.table_id),task_label:publicLabel(r.row_key,'未另列子任务')})),[['模型','model_canonical'],['实验设置','model_setting'],['指标','metric'],['论文原值','value_raw'],['数值','value_numeric'],['来源表','source_label'],['子任务','task_label']]);drawTable('task-matches',d.task_matches.map(r=>({...r,source_label:sourceLabel(r.table_id)})),[['能力','capability_id'],['任务匹配','match_kind'],['指标','metric'],['设置','model_setting'],['审核阻断','blocked_reasons'],['来源表','source_label']]);document.getElementById('window').textContent='当前窗口 ['+d.window.start+', '+d.window.end+') · 固定快照，不自动更新 · 来源成绩未独立复现';}
async function refresh(){if(loading)return;loading=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);try{const q=new URLSearchParams(location.search),paper=q.get('paper_id'),benchmark=q.get('benchmark_id');if(!paper||!benchmark||[...q.keys()].some(k=>!['paper_id','benchmark_id','edition'].includes(k))||q.size!==(q.has('edition')?3:2)||(q.has('edition')&&q.get('edition')!=='admin'))throw new Error('invalid_identity');const response=await fetch(radarBase.href+'api/benchmark?'+new URLSearchParams({paper_id:paper,benchmark_id:benchmark}),{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error(response.status===404?'expired':'unavailable');render(await response.json());}catch(error){detail=null;document.getElementById('title').textContent=error.message==='expired'?'此 Benchmark 已离开当前窗口':'Benchmark 详情暂不可用';document.getElementById('summary').textContent=error.message==='expired'?'当前页面只显示当前窗口的新 Benchmark。':'请检查链接或稍后刷新。';for(const id of ['tested-models','meta','stats','tags','resources','chart','observations','task-matches','window','group-status','metric-group'])document.getElementById(id).replaceChildren();}finally{clearTimeout(timeout);loading=false;}}
document.getElementById('metric-group').addEventListener('change',event=>{chosenGroup=event.target.value;chart();});document.getElementById('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,600000);
