<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benchmark 日期表</title><style>
body{font:16px/1.6 system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 18px;color:#193347}a{color:#176dc0}aside{background:#f0f6fb;padding:16px;border-radius:10px}form{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{padding:10px;font:inherit}input{flex:1;min-width:180px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{padding:10px;text-align:left;border-bottom:1px solid #dce5ed;vertical-align:top}td:first-child{overflow-wrap:anywhere;max-width:260px}.scroll{overflow:auto}nav{display:flex;gap:14px;align-items:center;margin:20px 0}small{color:#52697b}
</style><main><p><a href="./">每日统计</a> · <a href="api/v1/judge.html">名称／论文查询</a> · <a href="date-table.json.gz">下载完整日期表与修订记录</a></p><h1>Benchmark 日期表</h1>
<aside>先查表复用日期；有新的公开日期就更新。找不到可用日期时，采用关联论文首次发布日期，标注“论文日期回填”。同名记录按名称合并，已核实的不同实体保持分开。确认误收的条目保留排除原因。</aside>
<p id="summary" role="status">正在读取日期表…</p>
<section id="papers" hidden><h2>新 benchmark 论文数</h2><p id="paper-summary"></p><table><thead><tr><th>登记日期</th><th>去重论文（篇）</th><th>其中采用论文日期回填（篇）</th></tr></thead><tbody id="paper-days"></tbody></table></section>
<form id="filter"><input id="search" aria-label="搜索 benchmark 名称" placeholder="搜索 benchmark 名称"><select id="kind" aria-label="日期类型"><option value="all">全部条目</option><option value="new">目录声明的新 benchmark</option><option value="fallback">论文日期回填</option><option value="primary">已有公开日期／核实日期</option><option value="excluded">已排除</option><option value="missing">论文日期也缺失</option></select><input id="day" type="date" aria-label="筛选日期"><button type="reset">清除筛选</button></form>
<div class="scroll"><table><thead><tr><th>Benchmark</th><th>登记日期</th><th>日期来源</th><th>目录新旧判断</th><th>说明／操作</th></tr></thead><tbody id="rows"></tbody></table></div><nav><button id="prev">上一页</button><span id="page" aria-live="polite"></span><button id="next">下一页</button></nav><small>这是当前收录数据的登记表，包含论文日期回填；不是全网新 benchmark 总量。核实首发证据仍可在查询接口中单独查看。</small></main>
<script type="module">
let entries=[],page=0,dataPaperSummary=null;const size=100,$=id=>document.getElementById(id),names={PAPER_PUBLICATION_FALLBACK:'论文日期回填',VERIFIED_FIRST_PUBLIC:'首发日期已核实',PRIMARY_PUBLIC_DATE:'已有公开日期',EXCLUDED:'已排除',MISSING_PAPER_DATE:'论文日期也缺失'},novelty={SOURCE_NEW_CLAIM:'目录声明新建',EXISTING_OR_UPDATE:'已有／更新',UNCLASSIFIED:'未分类'};
function render(){const q=$('search').value.trim().toLocaleLowerCase(),kind=$('kind').value,day=$('day').value;
const list=entries.filter(e=>(!q||e.name.toLocaleLowerCase().includes(q))&&(!day||e.benchmark_date===day)&&(kind==='all'||kind==='new'&&e.newness==='SOURCE_NEW_CLAIM'&&!e.excluded||kind==='fallback'&&e.date_is_fallback||kind==='primary'&&e.benchmark_date&&!e.date_is_fallback&&!e.excluded||kind==='excluded'&&e.excluded||kind==='missing'&&!e.benchmark_date&&!e.excluded));
page=Math.min(page,Math.max(0,Math.ceil(list.length/size)-1));$('rows').replaceChildren();
for(const e of list.slice(page*size,(page+1)*size)){const tr=document.createElement('tr');for(const value of [e.name,e.excluded?'—':e.benchmark_date||'缺失',names[e.date_basis]||e.date_basis,novelty[e.newness]||e.newness]){const td=document.createElement('td');td.textContent=value;tr.append(td);}const td=document.createElement('td');if(e.excluded)td.textContent=e.exclusion_reason||'不是独立 benchmark';else{const a=document.createElement('a');a.textContent='查看来源';a.href='api/v1/judge.html?q='+encodeURIComponent(e.entity_ids[0]);td.append(a);if(e.identity_basis==='NORMALIZED_NAME_ASSUMPTION')td.append(' · 按名称合并');if(e.identity_basis==='AMBIGUOUS_REVIEWED_NAME')td.append(' · 同名身份待选');}tr.append(td);$('rows').append(tr);}
$('page').textContent=`${list.length} 个条目 · 第 ${page+1} / ${Math.max(1,Math.ceil(list.length/size))} 页`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=list.length;}
$('filter').addEventListener('input',()=>{page=0;render();});$('filter').addEventListener('submit',e=>e.preventDefault());$('filter').addEventListener('reset',()=>setTimeout(()=>{page=0;render();},0));$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
try{const r=await fetch('date-table-index.json');if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();entries=data.entries;const s=data.summary;dataPaperSummary=s.paper_counts;$('summary').textContent=`已登记 ${s.active_benchmarks} 个 · 已有日期 ${s.dated_benchmarks} 个 · 论文日期回填 ${s.paper_date_fallbacks} 个 · 排除 ${s.excluded_benchmarks} 个 · 日期仍缺失 ${s.missing_dates} 个。数据时间：${s.source_generated_at}`;render();}catch(e){$('summary').textContent='日期表读取失败：'+e.message;$('prev').disabled=$('next').disabled=true;}
const pc=dataPaperSummary;function showPapers(p){if(!p)return;$('papers').hidden=false;$('paper-summary').textContent=`${p.period.start} 至 ${p.period.end_exclusive}（结束日不含）：${p.new_benchmark_papers} 篇，日均 ${p.daily_average.toFixed(1)} 篇。${p.notice}`;for(const d of p.days){const tr=document.createElement('tr');for(const v of [d.date,d.new_benchmark_papers,d.paper_date_fallbacks]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('paper-days').append(tr);}}showPapers(pc);
</script></html>
