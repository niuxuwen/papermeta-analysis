name: Publish visitor website
on:
  push:
    branches: [main, live-data]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        id: feed
        with:
          ref: live-data
          path: .live-feed
      - uses: actions/setup-node@v4
        if: steps.feed.outcome == 'success'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 ijson==3.6.0
      - name: Build and validate latest verified public data
        if: steps.feed.outcome == 'success'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          python -m unittest discover -s backend -p "test_release*.py"
          node --test backend/test_release_client.mjs
          node test-large-json.cjs
          python -m unittest discover -s ratings -p test_source_quality.py
          python -m unittest discover -s ratings -p test_display_coverage.py
          python -m unittest discover -s ratings -p test_identity_projection.py
          python -m unittest discover -s ratings -p test_effort_projection.py
          python -m unittest discover -s ratings -p test_opus_release.py
          python -m unittest discover -s ratings -p test_reviewed_evidence.py
          python -m unittest discover -s ratings -p test_raw_elo.py
          python -m unittest discover -s ratings -p test_soft_outcomes.py
          python -m unittest discover -s ratings -p test_common_basket.py
          python -m unittest discover -s ratings -p test_source_integrity.py
          python -m unittest discover -s ratings -p test_metric_semantics.py
          python -m unittest discover -s backend -p test_sample_sizes.py
          node ratings/test_display_coverage.cjs
          python3 backend/build_live.py .live-feed/feed
          node build-home.cjs
          python ratings/build_elo.py .live-feed/feed
          python ratings/build_capability_rankings.py .live-feed/feed
          python ratings/validate_common_basket_publication.py
          node refresh-elo-home.cjs
          python backend/build_editions.py
          python backend/build_release_site.py .live-feed/feed
          node validate-live.cjs .live-feed/feed/publication.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: pages_artifact
        with:
          # Re-runs can retain artifacts from earlier attempts.
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: site
      - name: Wait for the uploaded Pages artifact
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return a valid artifact ID."
            exit 1
          fi
          for (( attempt=1; attempt<=10; attempt++ )); do
            if visible_ids=$(timeout 5s gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false and .size_in_bytes > 0) | .id'); then
              if [[ "$visible_ids" == "$PAGES_ARTIFACT_ID" ]]; then
                # Pages uses a separate artifact listing. Give it time to catch up.
                sleep 5
                echo "Pages artifact $PAGES_ARTIFACT_NAME ($PAGES_ARTIFACT_ID) is visible."
                exit 0
              fi
            fi
            if (( attempt < 10 )); then sleep 5; fi
          done
          echo "::error::Expected Pages artifact $PAGES_ARTIFACT_NAME ($PAGES_ARTIFACT_ID) did not appear in this run."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          # Allow bounded extra time for Pages server-side file synchronization.
          timeout: 600000
